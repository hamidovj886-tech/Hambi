
name: Build Hambi Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/uz/hambilite/app
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/uz/hambilite/app/
          cp AndroidManifest.xml app/src/main/
          cp styles.xml app/src/main/res/values/

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1'
          }

          android {
              namespace 'uz.hambilite.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'uz.hambilite.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'HambiLite'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hambi-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


