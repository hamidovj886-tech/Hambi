
name: Build Hambi Lite APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository structure:"
          find . -maxdepth 5 -type f | sort
          echo "Checking Android project files..."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android project
        run: |
          test -f settings.gradle || {
            echo "settings.gradle not found in repository root"
            exit 1
          }
          test -f app/build.gradle || {
            echo "app/build.gradle not found"
            exit 1
          }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hambi-Lite-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
